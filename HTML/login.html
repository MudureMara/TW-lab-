<!DOCTYPE html>

<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-image">
            <img src="../MEDIA/images.png" alt="Imagine login">
        </div>


    <div class="separator"></div>

    <div class="login-form">
        <h2>Autentificare</h2>
        <input type="email" placeholder="Adresa de email">
        <input type="password" placeholder="Parola">
        <button type="button" onclick="window.location.href='home.html'">Conectare</button>

        <p class="register-text">Nu ai cont? <a href="register.html">Înregistrează-te</a>
        </p>
    </div>
</div>


</body>
</html>
